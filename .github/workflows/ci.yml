name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

# A new push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # No database needed: every test is a unit or WebMvc slice test.
      - name: Build and test
        run: ./mvnw -B -ntp clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 7

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `build` runs `tsc --noEmit` first, so this is the type check too.
      - name: Type check and bundle
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: todolist
          POSTGRES_USER: todolist
          POSTGRES_PASSWORD: todolist
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U todolist -d todolist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/todolist
      DB_USERNAME: todolist
      DB_PASSWORD: todolist

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Package the API
        run: ./mvnw -B -ntp clean package -DskipTests

      # A fixed secret, so tokens stay valid for the whole run.
      - name: Start the API
        run: |
          JWT_SECRET="$(openssl rand -base64 48)" \
          SPRING_PROFILES_ACTIVE=local \
          nohup java -jar target/*.jar > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "API did not start"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Start the SPA
        working-directory: frontend
        run: |
          nohup npm run dev -- --port 3000 --strictPort > "$RUNNER_TEMP/spa.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null; then
              echo "SPA is up"; exit 0
            fi
            sleep 2
          done
          echo "SPA did not start"; cat "$RUNNER_TEMP/spa.log"; exit 1

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --grep-invert "documentation screenshots"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: ${{ runner.temp }}/*.log
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only — publishing happens in release.yml.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: spring-boot-todolist-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the SPA image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: spring-boot-todolist-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
