# インメモリH2で動かす開発プロファイル。PostgreSQL も Flyway も不要。
# 本番・ステージングでは使用しない（H2コンソールを公開するため）。
spring.datasource.url=jdbc:h2:mem:todolist;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway のマイグレーションは PostgreSQL 専用のため、H2 では ddl-auto で構築する。
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.servlet.session.cookie.secure=false

logging.level.com.todolist=DEBUG

app.bootstrap.admin-username=${APP_ADMIN_USERNAME:}
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:}
app.bootstrap.admin-email=${APP_ADMIN_EMAIL:}
