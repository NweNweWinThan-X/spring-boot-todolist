# ローカル開発プロファイル。シークレットは環境変数から渡す。

# ローカルは TLS を終端しないため Secure 属性を外す。この上書きは local 限定。
server.servlet.session.cookie.secure=false

spring.docker.compose.enabled=false

# 初回起動時に管理者を作成する。未設定ならスキップされる。
app.bootstrap.admin-username=${APP_ADMIN_USERNAME:}
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:}

logging.level.com.todolist=DEBUG
app.bootstrap.admin-email=${APP_ADMIN_EMAIL:}
