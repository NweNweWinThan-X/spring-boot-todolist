# ゼロ設定のローカル開発プロファイル。
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# 環境変数を1つも設定しなくても起動する。ここに書いた接続情報は localhost の
# 開発DB専用の捨て値であり、本番・ステージングはこの profile を使わない
# （application.properties 側の ${DB_PASSWORD} は既定値なしのまま）。
#
# 接続先は todolist データベース。DBeaver が既定で開く postgres データベースには
# アプリのテーブルは1つもない（スキーマは Flyway が todolist 側に作る）。
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/todolist}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# スキーマは db/migration、デモデータは db/seed。
# db/seed は dev プロファイルだけが読む。本番は db/migration しか見ないため
# デモデータが入る経路はない。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# ローカルは TLS を終端しないため Secure 属性を外す。この上書きは dev 限定。
server.servlet.session.cookie.secure=false
spring.docker.compose.enabled=false

logging.level.com.todolist=DEBUG

# 署名鍵は未設定のままなので起動ごとにランダム生成され、再起動で再ログインが必要になる。
# 固定したい場合だけ環境変数で渡す:  export JWT_SECRET=$(openssl rand -base64 32)
# 開発用の鍵でもコミットはしない。

# デモデータが demo / alex を作るため、管理者ブートストラップは任意。
app.bootstrap.admin-username=${APP_ADMIN_USERNAME:}
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:}
app.bootstrap.admin-email=${APP_ADMIN_EMAIL:}
