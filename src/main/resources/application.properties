spring.application.name=todolist
spring.profiles.default=local

# --- Datasource (secrets via environment variables only) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/todolist}
spring.datasource.username=${DB_USERNAME:todolist}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Flyway ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Character encoding (security audit No.13 / No.14) ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# --- Session cookie (security audit No.2) ---
# TLS is terminated in front of the application in every deployed environment.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax

# --- Error responses (security audit No.12) ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# --- Actuator (security audit No.12) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- JWT (secret via environment variable only; see security audit No.19) ---
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# --- H2 console stays off unless a dev profile switches it on ---
spring.h2.console.enabled=false
