server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the server version.
  server_tokens off;

  # The same headers the API sets, so the two surfaces agree.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  # Hashed assets never change under the same name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routing: every unknown path is handled by the SPA, not 404.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
